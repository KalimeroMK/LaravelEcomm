# =============================================================================
# DOCKER COMPOSE - LOCAL DEVELOPMENT
# =============================================================================
# Овој фајл е за локален развој. За продукција користи:
# docker-compose -f docker-compose.prod.yml up -d
# =============================================================================

services:
  app:
    build:
      context: .docker
      dockerfile: Dockerfile
    container_name: e_comm_app
    restart: unless-stopped
    working_dir: /var/www/
    volumes:
      - ./:/var/www
      - ./.docker/php/conf.d/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
      - ./.docker/php/conf.d/error_reporting.ini:/usr/local/etc/php/conf.d/error_reporting.ini
      - ./.docker/php/conf.d/performance.ini:/usr/local/etc/php/conf.d/performance.ini
    networks:
      - laravelapp
    ports:
      - "90:80"
    healthcheck:
      test: [ "CMD", "php", "artisan", "--version" ]
      interval: 30s
      retries: 3
      start_period: 10s
      timeout: 10s
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      - SERVER_NAME=:80
      - PHP_OPCACHE_ENABLE=0
      - DB_HOST=db
      - DB_PORT=3306
      - REDIS_HOST=redis
      - ELASTICSEARCH_HOST=elasticsearch

  # Queue worker — required now that QUEUE_CONNECTION=redis (delayed jobs,
  # newsletters, media conversions and abandoned-cart emails run here).
  queue:
    build:
      context: .docker
      dockerfile: Dockerfile
    container_name: e_comm_queue
    restart: unless-stopped
    working_dir: /var/www/
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
    healthcheck:
      test: [ "CMD", "php", "artisan", "--version" ]
      interval: 30s
      retries: 3
      start_period: 10s
      timeout: 10s
    volumes:
      - ./:/var/www
    networks:
      - laravelapp
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - REDIS_HOST=redis
      - ELASTICSEARCH_HOST=elasticsearch

  # Scheduler — runs due scheduled tasks (abandoned-cart emails, cleanups,
  # scheduled reports) every minute.
  scheduler:
    build:
      context: .docker
      dockerfile: Dockerfile
    container_name: e_comm_scheduler
    restart: unless-stopped
    working_dir: /var/www/
    command: php artisan schedule:work
    healthcheck:
      test: [ "CMD", "php", "artisan", "--version" ]
      interval: 30s
      retries: 3
      start_period: 10s
      timeout: 10s
    volumes:
      - ./:/var/www
    networks:
      - laravelapp
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - REDIS_HOST=redis
      - ELASTICSEARCH_HOST=elasticsearch

  db:
    image: mariadb:11.8
    container_name: e_comm_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: homestead
      MYSQL_USER: homestead
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret
      MARIADB_AUTO_UPGRADE: 1
    command: >
      --innodb-buffer-pool-size=256M
      --innodb-log-file-size=64M
      --innodb-flush-log-at-trx-commit=2
    volumes:
      - mysql_data:/var/lib/mysql
      - ./.docker/mysql/my.cnf:/etc/mysql/my.cnf
      - ./.docker/mysql/init:/docker-entrypoint-initdb.d
    networks:
      - laravelapp
    ports:
      - "3311:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      retries: 3
      start_period: 30s
      timeout: 10s

  redis:
    image: redis:alpine
    container_name: e_comm_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - laravelapp
    ports:
      - "6381:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 30s
      retries: 3
      start_period: 5s
      timeout: 10s

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.0
    container_name: e_comm_elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - laravelapp
    ports:
      - "9200:9200"
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1" ]
      interval: 30s
      retries: 3
      start_period: 60s
      timeout: 10s

  # Mailpit за тестирање мејлови локално
  mailpit:
    image: axllent/mailpit:latest
    container_name: e_comm_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    networks:
      - laravelapp
    volumes:
      - mailpit_data:/data

networks:
  laravelapp:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  elasticsearch_data:
    driver: local
  mailpit_data:
    driver: local
